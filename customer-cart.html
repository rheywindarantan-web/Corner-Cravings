<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review Order · Corner Cravings</title>
  <link rel="icon" type="image/png" href="Logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="customer.css" />
  <script src="menu-data.js" defer></script><script src="inventory-data.js" defer></script><script src="customer.js" defer></script>
</head>
<body>

  <!-- Accessible Skip Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Top Navigation Header matching Figma Mockup -->
  <header class="ro-nav-header" role="banner">
    <div class="ro-nav-container">
      <div style="display: flex; align-items: center;">
        <a href="customer-home.html" class="ro-nav-brand" aria-label="Corner Cravings Home">
          <img class="ro-nav-logo" src="Logo.png" alt="Corner Cravings Logo" width="36" height="36" />
        </a>

        <nav class="customer-nav" aria-label="Customer Navigation">
          <ul class="ro-nav-menu">
            <li><a href="customer-home.html">Home</a></li>
            <li><a href="customer-menu.html">Menu</a></li>
            <li><a href="#" data-action="promo">Promo</a></li>
          </ul>
        </nav>
      </div>

      <!-- Search Menu Bar -->
      <div class="ro-search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="header-search-input" placeholder="Search menu..." aria-label="Search menu" />
      </div>

      <!-- Right Action Icons -->
      <div class="ro-nav-actions">
        <a href="customer-cart.html" class="ro-icon-btn" aria-label="View Cart">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="ro-cart-pill cart-badge" style="display:none;">0</span>
        </a>

        <button type="button" class="ro-icon-btn" data-action="profile" aria-label="Customer Profile">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main id="main-content" class="ro-body-wrapper">
    <div class="ro-main-container">

      <!-- Review Order Title Row -->
      <div class="ro-header-row">
        <a href="customer-menu.html" class="ro-back-arrow-btn" aria-label="Back to menu" title="Back to menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </a>
        <h1 class="ro-page-title">Review Order</h1>
      </div>

      <!-- Main Dynamic Review Grid -->
      <div id="review-order-content">
        <!-- Rendered dynamically -->
      </div>

    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var contentArea = document.getElementById('review-order-content');

      function renderReviewPage() {
        if (!contentArea || !window.CornerCravings) return;

        var cart = window.CornerCravings.getCart();
        var delivery = window.CornerCravings.getDeliveryDetails();
        var currentMethod = delivery.method || 'standard';
        var totals = window.CornerCravings.calculateCartTotals(currentMethod);

        if (cart.length === 0) {
          contentArea.innerHTML = '<div class="ro-card" style="text-align:center; padding: 48px 24px;">' +
            '<div style="font-size: 40px; margin-bottom: 12px;">🛒</div>' +
            '<h2 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Your Cart is Empty</h2>' +
            '<p style="font-size: 14px; color: #796b63; margin-bottom: 24px;">Looks like you haven’t added any delicious cravings yet.</p>' +
            '<a href="customer-menu.html" class="btn btn-primary" style="display:inline-flex; align-items:center; justify-content:center; text-decoration:none;">Browse Menu</a>' +
          '</div>';
          return;
        }

        var validation = window.CornerCravings.validateCart ? window.CornerCravings.validateCart() : { valid: true, issues: [], items: [] };
        var storeStatus = window.CornerCravings.getStoreStatus ? window.CornerCravings.getStoreStatus() : { isOpen: true, hours: '9:00 AM – 9:00 PM' };

        // 1. Build Item Cards
        var itemsHtml = '';
        if (!storeStatus.isOpen) {
          itemsHtml += '<div class="ro-cart-alert" style="background:#fffbeb; border:1px solid #fde68a; color:#92400e; padding:12px 16px; border-radius:10px; margin-bottom:16px; font-size:13px; line-height:1.4;">' +
            '<strong>Store Notice:</strong> Corner Cravings is currently closed (Hours: ' + storeStatus.hours + '). You may still proceed with your order; our kitchen will prepare it when the store opens at 9:00 AM.' +
          '</div>';
        }
        if (!validation.valid && validation.issues.length > 0) {
          itemsHtml += '<div class="ro-cart-alert" style="background:#fef2f2; border:1px solid #fecaca; color:#991b1b; padding:12px 16px; border-radius:10px; margin-bottom:16px; font-size:13px; line-height:1.4;">' +
            '<strong>Notice:</strong> ' + validation.issues.join(' ') + ' Please remove unavailable items to continue.' +
          '</div>';
        }

        for (var i = 0; i < cart.length; i++) {
          var item = cart[i];
          var itemValidation = validation.items ? validation.items[i] : null;
          var isAvailable = itemValidation ? itemValidation.available : true;

          var subtext = item.customizationText || '';
          if (!subtext) {
            var opts = [];
            if (item.size) opts.push(item.size);
            if (item.addons && item.addons.length > 0) {
              opts.push(item.addons.map(function(a){ return a.name; }).join(', '));
            }
            subtext = opts.join(' · ') || 'Standard Serving';
          }

          var unavailBadge = !isAvailable ? '<div style="font-size:11px; font-weight:700; color:#b91c1c; background:#fee2e2; display:inline-block; padding:2px 8px; border-radius:4px; margin-top:4px;">Currently Unavailable</div>' : '';

          var thumbFallback = "this.onerror=null;this.parentElement.innerHTML='<span class=\"ro-item-thumb-placeholder\" aria-label=\"Image coming soon\">＋</span>';";
          var thumbHtml = item.imageJpg ? '<img src="' + item.imageJpg + '" alt="' + item.name + '" loading="lazy" onerror="' + thumbFallback + '" />' : '<span class="ro-item-thumb-placeholder" aria-label="Image coming soon">＋</span>';
          itemsHtml += '<div class="ro-item-card ' + (!isAvailable ? 'is-unavailable' : '') + '" data-key="' + item.optionKey + '" style="' + (!isAvailable ? 'opacity:0.75; border-color:#fca5a5;' : '') + '">' +
            '<div class="ro-item-thumb">' + thumbHtml + '</div>' +

            '<div class="ro-item-info">' +
              '<h3 class="ro-item-name">' + item.name + '</h3>' +
              '<div class="ro-item-meta">' + subtext + '</div>' +
              unavailBadge +
              '<div class="ro-item-price">' + window.CornerCravings.formatPeso(item.unitPrice) + '</div>' +
            '</div>' +

            '<div class="ro-item-actions">' +
              '<button type="button" class="ro-btn-delete" data-action="del" aria-label="Remove ' + item.name + '" title="Remove item">' +
                '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                  '<polyline points="3 6 5 6 21 6"></polyline>' +
                  '<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>' +
                '</svg>' +
              '</button>' +

              '<div class="ro-stepper">' +
                '<button type="button" class="ro-stepper-btn" data-action="dec" aria-label="Decrease quantity">&minus;</button>' +
                '<span class="ro-stepper-val">' + item.quantity + '</span>' +
                '<button type="button" class="ro-stepper-btn" data-action="inc" aria-label="Increase quantity">&plus;</button>' +
              '</div>' +
            '</div>' +
          '</div>';
        }

        // 2. Build Delivery Address lines
        var recipientName = delivery.recipientName || '';
        var addressLine = delivery.address || '';
        var cityArea = delivery.area ? (delivery.landmark ? (delivery.landmark + ', ' + delivery.area) : delivery.area) : (delivery.landmark || '');
        if (delivery.landmark && cityArea && !cityArea.includes(delivery.landmark)) {
          cityArea = delivery.landmark + ' · ' + (delivery.area || '');
        }
        var contactPhone = delivery.contactNumber || '';

        // 3. Assemble Layout
        var html = '<div class="ro-grid-layout">' +
          '<!-- Left Column: Items -->' +
          '<div>' +
            '<h2 class="ro-section-heading">Your Items</h2>' +
            '<div class="ro-items-stack">' +
              itemsHtml +
            '</div>' +

            '<a href="customer-menu.html" class="ro-btn-add-more">' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
                '<circle cx="12" cy="12" r="10"></circle>' +
                '<line x1="12" y1="8" x2="12" y2="16"></line>' +
                '<line x1="8" y1="12" x2="16" y2="12"></line>' +
              '</svg>' +
              '<span>Add more items</span>' +
            '</a>' +
          '</div>' +

          '<!-- Right Column: Sidebar Cards -->' +
          '<div class="ro-sidebar">' +
            '<!-- Delivery Address Card with Edit Link -->' +
            '<div class="ro-card">' +
              '<div class="ro-card-head">' +
                '<div class="ro-card-title-group">' +
                  '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" stroke="none" class="icon-pin">' +
                    '<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>' +
                  '</svg>' +
                  '<span>Delivery Address</span>' +
                '</div>' +
                '<a href="customer-delivery.html?from=review" class="ro-edit-link" id="btn-edit-delivery" title="Edit delivery details">' + (recipientName || addressLine ? 'Edit' : 'Add') + '</a>' +
              '</div>' +

              '<div class="ro-address-text">' +
                (recipientName ? '<div class="ro-address-name">' + recipientName + '</div>' : '') +
                (addressLine ? '<div>' + addressLine + '</div>' : '') +
                (cityArea ? '<div>' + cityArea + '</div>' : '') +
                (contactPhone ? '<div class="ro-address-phone">' + contactPhone + '</div>' : '') +
                (!recipientName && !addressLine ? '<div style="color:var(--text-muted); font-size:13.5px;">No delivery address provided yet.<br><a href="customer-delivery.html?from=review" style="color:var(--primary); font-weight:600; text-decoration:underline;">Click to enter address</a></div>' : '') +
              '</div>' +
            '</div>' +

            '<!-- Delivery Options Selection Card -->' +
            '<div class="ro-card">' +
              '<div class="ro-card-head" style="margin-bottom:12px;">' +
                '<div class="ro-card-title-group">' +
                  '<span>Delivery Options</span>' +
                '</div>' +
              '</div>' +

              '<div class="ro-options-list" id="delivery-options-group">' +
                '<!-- Standard Delivery -->' +
                '<div class="ro-option-row ' + (currentMethod === 'standard' ? 'is-selected' : '') + '" data-method="standard">' +
                  '<div class="ro-option-content">' +
                    '<div class="ro-radio-circle">' +
                      '<div class="ro-radio-dot"></div>' +
                    '</div>' +
                    '<div>' +
                      '<div class="ro-option-name">Standard Delivery</div>' +
                      '<div class="ro-option-desc">30–45 mins</div>' +
                    '</div>' +
                  '</div>' +
                  '<div class="ro-option-fee">₱50.00</div>' +
                '</div>' +

                '<!-- Priority Delivery -->' +
                '<div class="ro-option-row ' + (currentMethod === 'priority' ? 'is-selected' : '') + '" data-method="priority">' +
                  '<div class="ro-option-content">' +
                    '<div class="ro-radio-circle">' +
                      '<div class="ro-radio-dot"></div>' +
                    '</div>' +
                    '<div>' +
                      '<div class="ro-option-name">Priority Delivery</div>' +
                      '<div class="ro-option-desc">15–30 mins (Jump the queue)</div>' +
                    '</div>' +
                  '</div>' +
                  '<div class="ro-option-fee">₱100.00</div>' +
                '</div>' +

                '<!-- Self-Pickup -->' +
                '<div class="ro-option-row ' + (currentMethod === 'pickup' ? 'is-selected' : '') + '" data-method="pickup">' +
                  '<div class="ro-option-content">' +
                    '<div class="ro-radio-circle">' +
                      '<div class="ro-radio-dot"></div>' +
                    '</div>' +
                    '<div>' +
                      '<div class="ro-option-name">Self-Pickup</div>' +
                      '<div class="ro-option-desc">Ready in 15 mins</div>' +
                    '</div>' +
                  '</div>' +
                  '<div class="ro-option-fee">Free</div>' +
                '</div>' +
              '</div>' +
            '</div>' +

            '<!-- Order Summary Card -->' +
            '<div class="ro-summary-card">' +
              '<div class="ro-card-head" style="margin-bottom: 16px;">' +
                '<div class="ro-card-title-group">' +
                  '<span style="font-size: 18px;">🧾</span>' +
                  '<span>Order Summary</span>' +
                '</div>' +
              '</div>' +

              '<div class="ro-summary-lines">' +
                '<div class="ro-summary-line">' +
                  '<span>Subtotal (' + totals.itemCount + ' items)</span>' +
                  '<span>' + window.CornerCravings.formatPeso(totals.subtotal) + '</span>' +
                '</div>' +
                '<div class="ro-summary-line">' +
                  '<span>Delivery Fee</span>' +
                  '<span>' + (totals.deliveryFee > 0 ? window.CornerCravings.formatPeso(totals.deliveryFee) : 'Free') + '</span>' +
                '</div>' +
                '<div class="ro-summary-line">' +
                  '<span>Estimated Tax</span>' +
                  '<span>' + window.CornerCravings.formatPeso(totals.estimatedTax) + '</span>' +
                '</div>' +
              '</div>' +

              '<!-- Promo Code Box -->' +
              '<div class="ro-promo-box">' +
                '<div class="ro-promo-input-wrap">' +
                  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                    '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>' +
                    '<line x1="7" y1="7" x2="7.01" y2="7"></line>' +
                  '</svg>' +
                  '<input type="text" class="ro-promo-input" id="ro-promo-code" placeholder="PROMO CODE" />' +
                '</div>' +
                '<button type="button" class="ro-btn-apply" id="ro-btn-apply-promo">Apply</button>' +
              '</div>' +

              '<!-- Total -->' +
              '<div class="ro-total-row">' +
                '<span class="ro-total-label">Total</span>' +
                '<span class="ro-total-val">' + window.CornerCravings.formatPeso(totals.total) + '</span>' +
              '</div>' +

              '<!-- Proceed Button -->' +
              '<a href="customer-delivery.html" class="ro-btn-checkout" id="btn-proceed-checkout">' +
                'Proceed to Checkout &rarr;' +
              '</a>' +

              '<div class="ro-secure-note">' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
                  '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>' +
                  '<path d="M7 11V7a5 5 0 0 1 10 0v4"></path>' +
                '</svg>' +
                '<span>Secure Checkout</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';

        contentArea.innerHTML = html;

        // Attach listeners for steppers and removal
        var itemRows = contentArea.querySelectorAll('.ro-item-card');
        itemRows.forEach(function (row) {
          var key = row.getAttribute('data-key');
          var incBtn = row.querySelector('[data-action="inc"]');
          var decBtn = row.querySelector('[data-action="dec"]');
          var delBtn = row.querySelector('[data-action="del"]');

          var currentItem = cart.find(function(x){ return x.optionKey === key; });
          if (!currentItem) return;

          if (incBtn) {
            incBtn.addEventListener('click', function () {
              window.CornerCravings.updateItemQuantity(key, currentItem.quantity + 1);
              renderReviewPage();
            });
          }
          if (decBtn) {
            decBtn.addEventListener('click', function () {
              window.CornerCravings.updateItemQuantity(key, currentItem.quantity - 1);
              renderReviewPage();
            });
          }
          if (delBtn) {
            delBtn.addEventListener('click', function () {
              window.CornerCravings.removeItemFromCart(key);
              renderReviewPage();
            });
          }
        });

        // Delivery option selection
        var optRows = contentArea.querySelectorAll('.ro-option-row');
        optRows.forEach(function (row) {
          row.addEventListener('click', function () {
            var m = this.getAttribute('data-method');
            window.CornerCravings.setDeliveryMethod(m);
            renderReviewPage();
          });
        });

        // Proceed to Checkout guard
        var checkoutBtn = document.getElementById('btn-proceed-checkout');
        if (checkoutBtn) {
          checkoutBtn.addEventListener('click', function (e) {
            var v = window.CornerCravings.validateCart ? window.CornerCravings.validateCart() : { valid: true };
            if (!v.valid) {
              e.preventDefault();
              window.CornerCravings.showToast(v.issues && v.issues.length ? v.issues[0] : 'Please remove unavailable items before checkout.');
            }
          });
        }

        // Promo code apply button
        var promoBtn = document.getElementById('ro-btn-apply-promo');
        if (promoBtn) {
          promoBtn.addEventListener('click', function () {
            var promoInp = document.getElementById('ro-promo-code');
            var val = promoInp ? promoInp.value.trim().toUpperCase() : '';
            if (!val) {
              window.CornerCravings.showToast('Please enter a valid promo code.');
            } else if (val === 'WELCOME10' || val === 'FREEDEL' || val === 'CORNER50') {
              window.CornerCravings.showToast('Promo code ' + val + ' applied!');
            } else {
              window.CornerCravings.showToast('Invalid promo code. Try WELCOME10');
            }
          });
        }
      }

      // Initial render
      renderReviewPage();

      // Search menu listener in header
      var searchInput = document.getElementById('header-search-input');
      if (searchInput) {
        searchInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            var q = this.value.trim();
            window.location.href = 'customer-menu.html?search=' + encodeURIComponent(q);
          }
        });
      }
    });
  </script>
</body>
</html>
