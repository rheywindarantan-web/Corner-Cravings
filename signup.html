<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account · Corner Cravings Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <main class="auth-page auth-page--white">
    <section class="auth-card auth-card--login" aria-labelledby="signup-title">
      <div class="auth-brand">
        <img class="auth-brand__logo" src="logo.svg" alt="Corner Cravings logo" />
        <h1 class="auth-brand__name" id="signup-title">Corner Cravings</h1>
        <p class="auth-brand__subtitle">Create Admin Account</p>
      </div>

      <form id="signup-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="full-name">Full Name</label>
          <div class="input-field">
            <span class="input-field__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input class="input-field__control" type="text" id="full-name" name="fullName" placeholder="Jane Admin" autocomplete="name" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address</label>
          <div class="input-field">
            <span class="input-field__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 7 10-7"/></svg>
            </span>
            <input class="input-field__control" type="email" id="signup-email" name="email" placeholder="admin@cornercravings.com" autocomplete="email" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-password">Password</label>
          <div class="input-field">
            <span class="input-field__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input class="input-field__control" type="password" id="signup-password" name="password" placeholder="Create a password" autocomplete="new-password" required />
            <button type="button" class="input-field__toggle" data-toggle-target="signup-password" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.62 21.62 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-confirm-password">Confirm Password</label>
          <div class="input-field">
            <span class="input-field__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input class="input-field__control" type="password" id="signup-confirm-password" name="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" required />
            <button type="button" class="input-field__toggle" data-toggle-target="signup-confirm-password" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.62 21.62 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: var(--space-5);">Create Account</button>
        <a href="login.html" class="btn btn-secondary" style="margin-top: var(--space-3);">Back to Login</a>
      </form>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>
