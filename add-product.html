<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Product · Corner Cravings Admin</title>
  <link rel="icon" type="image/png" href="Logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <style>
    .form-panel { background: #fff; border: 1px solid var(--color-border-light); border-radius: var(--radius-md); padding: 24px; max-width: 760px; }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--color-text-heading); }
    .field input, .field textarea, .field select { border: 1px solid var(--color-border-light); border-radius: var(--radius-sm); padding: 12px 14px; font: inherit; color: var(--color-text-dark); background: #fff; }
    .field textarea { min-height: 120px; resize: vertical; }
    .form-actions { display: flex; gap: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <img class="sidebar__brand-logo" src="Logo.png" alt="Corner Cravings logo" width="44" height="44" />
        <div>
          <p class="sidebar__brand-name">Corner<br />Cravings</p>
          <p class="sidebar__brand-sub">Admin Panel</p>
        </div>
      </div>

      <nav class="sidebar__nav" aria-label="Primary">
        <a class="nav-item is-active" href="products.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Dashboard</span></a>
        <a class="nav-item" href="orders.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16l-1.5 9h-13z"/><path d="M4 4L3 2"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg><span>Orders</span></a>
        <a class="nav-item" href="stock-in.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21H3z"/><path d="M9 21v-8h6v8"/></svg><span>Manage Inventory</span></a>
        <a class="nav-item" href="profile.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg><span>Profile</span></a>
      </nav>

      <div class="sidebar__footer">
        <button class="btn-logout" type="button" onclick="window.location.href='login.html'"> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Logout</span></button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h2 class="topbar__title">Corner Cravings Admin</h2>
        <div class="topbar__search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="search" placeholder="Search..." aria-label="Search" /></div>
        <div class="topbar__actions"><button class="icon-btn" type="button" aria-label="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button></div>
      </header>

      <main class="page-content">
        <div class="page-header">
          <div><h1 class="page-header__title">Add Product</h1><p class="page-header__subtitle">Create a new bakery item for the menu.</p></div>
        </div>

        <section class="form-panel">
          <form id="add-product-form">
            <div class="field-grid">
              <div class="field">
                <label for="product-name">Product Name</label>
                <input id="product-name" type="text" placeholder="Cinnamon Roll" />
              </div>
              <div class="field">
                <label for="category">Category</label>
                <select id="category">
                  <option>Bread</option>
                  <option>Pastry</option>
                  <option>Coffee</option>
                  <option>Sandwich</option>
                </select>
              </div>
              <div class="field">
                <label for="price">Price</label>
                <input id="price" type="text" placeholder="$7.00" />
              </div>
              <div class="field">
                <label for="stock">Stock</label>
                <input id="stock" type="number" placeholder="25" />
              </div>
            </div>

            <div class="field" style="margin-top:16px;">
              <label for="description">Description</label>
              <textarea id="description" placeholder="Describe the product..."></textarea>
            </div>

            <div class="form-actions">
              <button class="btn-outline" type="button" data-route="products.html">Cancel</button>
              <button class="btn-solid-sm" type="submit">Save Product</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
