<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Add New Product · Corner Cravings Admin</title><link rel="icon" type="image/png" href="Logo.png" /><link rel="preconnect" href="https://fonts.googleapis.com" /><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="tokens.css" /><link rel="stylesheet" href="dashboard.css" /><link rel="stylesheet" href="add-product.css" /></head><body><div class="app-shell">
<aside class="sidebar"><div class="sidebar__brand"><img class="sidebar__brand-logo" src="Logo.png" alt="Corner Cravings logo" width="44" height="44" /><div><p class="sidebar__brand-name">Corner<br />Cravings</p><p class="sidebar__brand-sub">Admin Panel</p></div></div><nav class="sidebar__nav" aria-label="Primary"><a class="nav-item is-active" href="products.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>Dashboard</span></a><a class="nav-item" href="orders.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16l-1.5 9h-13z"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg><span>Orders</span></a><a class="nav-item nav-item--inventory-parent" href="stock-in.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5V21H3z"/></svg><span>Manage Inventory</span></a><a class="nav-item nav-item--sub" href="stock-in.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5m-6 6 6-6 6 6"/></svg><span>Stock In</span></a><a class="nav-item nav-item--sub" href="stock-out.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14m6-6-6 6-6-6"/></svg><span>Stock Out</span></a><a class="nav-item" href="profile.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg><span>Profile</span></a></nav><div class="sidebar__footer"><button class="btn-logout" type="button" data-logout-target="login.html"><span>Logout</span></button></div></aside>
<div class="main"><header class="topbar"><h2 class="topbar__title">Corner Cravings</h2><div class="topbar__search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-5-5"/></svg><input type="search" placeholder="Search..." aria-label="Search" /></div><div class="topbar__actions"><button class="icon-btn" type="button" aria-label="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg></button><button class="icon-btn" type="button" aria-label="Help">?</button></div></header>
<main class="page-content add-product-page"><a class="add-product-back" href="products.html">← Back to Products</a><h1 class="add-product-title">Add New Product</h1><form class="product-form-card" id="product-create-form" novalidate><div class="product-form-layout"><div class="product-fields"><div class="product-field product-field--full"><label for="product-name">Product Name</label><input id="product-name" name="name" type="text" placeholder="e.g. Sourdough Loaf" required /></div><div class="product-field"><label for="product-category">Category</label><select id="product-category" name="category" required><option value="">Select a category</option><option>Street Food</option><option>Rice Meal</option><option>Pasta</option><option>Tea</option><option>Coffee</option><option>Frappe</option><option>Dessert</option></select></div><div class="product-field"><label for="product-price">Price (₱)</label><div class="product-price-wrap"><span>₱</span><input id="product-price" name="price" type="number" min="0" step="0.01" placeholder="0.00" required /></div></div><div class="product-field product-field--full"><label for="product-description">Description</label><textarea id="product-description" name="description" placeholder="Briefly describe the product..." maxlength="300" required></textarea></div></div><div class="product-upload"><span class="product-image-label">Product Image</span><div class="upload-zone" id="product-upload-zone" role="button" tabindex="0" aria-label="Upload product image"><div class="upload-zone__content"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v14H4z"/><path d="m4 15 4-4 4 4 3-3 5 5"/><path d="M12 3v8m-3-3 3 3 3-3"/></svg><strong>Click to upload</strong><span>or drag and drop</span><small>SVG, PNG, JPG (max. 4 MB)</small></div><img class="upload-preview" id="product-image-preview" alt="Selected product preview" /></div><input id="product-image" name="image" type="file" accept="image/svg+xml,image/png,image/jpeg" hidden /></div></div><div class="product-form-actions"><a class="btn-outline" href="products.html">Cancel</a><button class="btn-solid-sm" type="submit">Save Product</button></div></form></main></div></div>
<div class="product-confirm" id="product-confirm" role="dialog" aria-modal="true" aria-labelledby="product-confirm-title"><div class="product-confirm__dialog"><h2 id="product-confirm-title">Done?</h2><p>Are you sure you want to finalize and save this product?</p><div class="product-confirm__actions"><button class="btn-outline" id="product-confirm-no" type="button">No</button><button class="btn-solid-sm" id="product-confirm-yes" type="button">Yes</button></div></div></div>
<script src="auth.js"></script><script src="add-product.js"></script></body></html>
