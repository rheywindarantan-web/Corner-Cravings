<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password · Corner Cravings Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <main class="auth-page auth-page--tinted">
    <section class="auth-card auth-card--elevated" aria-labelledby="forgot-title">

      <div class="auth-heading">
        <h1 class="auth-heading__title" id="forgot-title">Forgot Password?</h1>
        <p class="auth-heading__subtitle">Enter your email address and we'll send you a<br />link to reset your password.</p>
      </div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-field">
            <span class="input-field__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input
              class="input-field__control input-field__control--filled"
              type="email"
              id="email"
              name="email"
              placeholder="name@gmail.com"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="code">Verification Code</label>
          <div class="input-field">
            <span class="input-field__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h.01M7 12h.01M11 8h6M11 12h6M7 16h10"/></svg>
            </span>
            <input
              class="input-field__control input-field__control--filled"
              type="text"
              id="code"
              name="code"
              placeholder="Enter the code"
              inputmode="numeric"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: var(--space-5);">
          Verify and Reset
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <div class="auth-footer">
        <a class="btn-back" href="login.html">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to Login
        </a>
      </div>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>
