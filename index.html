<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corner Cravings</title>
  <style>
    :root {
      --bg: #f9f5f2;
      --card: #fffdfc;
      --primary: #a63f2f;
      --primary-dark: #7d2c22;
      --text: #2b2b2b;
      --muted: #6e5d59;
      --border: #eadfd8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f9f2ee, #fff);
      font-family: Inter, "Segoe UI", sans-serif;
      color: var(--text);
    }

    .wrap {
      width: min(760px, 90vw);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(61, 38, 27, 0.08);
      padding: 48px 32px;
      text-align: center;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 24px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3rem);
    }

    p {
      margin: 0 auto 30px;
      max-width: 560px;
      color: var(--muted);
      line-height: 1.6;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      height: 48px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 10px 18px rgba(166, 63, 47, 0.2);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #f9f0ed;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="logo.svg" alt="Corner Cravings logo" />
    <h1>Corner Cravings</h1>
    <p>Welcome to the admin and staff portal. Choose the login area you want to access.</p>

    <div class="actions">
      <a href="login.html" class="btn btn-primary">Admin Portal</a>
      <a href="staff-login.html" class="btn btn-secondary">Employee Portal</a>
    </div>
  </main>
</body>
</html>
