<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password · Corner Cravings Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <main class="auth-page auth-page--tinted">
    <section class="auth-card auth-card--elevated auth-card--accent" aria-labelledby="reset-title">

      <div class="auth-heading">
        <h1 class="auth-heading__title auth-heading__title--regular" id="reset-title">Reset Your Password</h1>
        <p class="auth-heading__subtitle">Enter your new password below to regain<br />access to your account.</p>
      </div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <div class="input-field">
            <span class="input-field__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input
              class="input-field__control"
              type="password"
              id="new-password"
              name="new-password"
              placeholder="Enter new password"
              autocomplete="new-password"
              required
            />
            <button type="button" class="input-field__toggle" data-toggle-target="new-password" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <div class="input-field">
            <span class="input-field__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            </span>
            <input
              class="input-field__control"
              type="password"
              id="confirm-password"
              name="confirm-password"
              placeholder="Confirm new password"
              autocomplete="new-password"
              required
            />
            <button type="button" class="input-field__toggle" data-toggle-target="confirm-password" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: var(--space-5);">Reset Password</button>
      </form>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>
